<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zyklus">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Zyklus</title>
<style>
@property --acc{syntax:'<color>';inherits:true;initial-value:#ff375f}
:root{color-scheme:dark;--acc:#ff375f;transition:--acc .6s ease;
  --bg:#000;--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;
  --tx:#fff;--tx2:rgba(235,235,245,.6);--tx3:rgba(235,235,245,.3);
  --red:#ff375f;--ov:#64d2ff;--pms:#ff9f0a;--spot:#d08a5c;--mood:#bf5af2;--blue:#0a84ff;--sep:rgba(84,84,88,.6);
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 -apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:calc(var(--st) + 8px) 16px calc(var(--sb) + 96px)}
body{background:transparent}
body::before{content:'';position:fixed;left:0;right:0;top:0;height:340px;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 75% 100% at 50% -25%,rgba(255,55,95,.3),transparent 72%);background:radial-gradient(ellipse 75% 100% at 50% -25%,color-mix(in srgb,var(--acc) 34%,transparent),transparent 72%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
.view{display:none}.view.on{display:block}
h1{font-size:34px;line-height:1.1;letter-spacing:-.02em;font-weight:700;margin:8px 0 16px}
h2{font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:.02em;color:var(--tx2);margin:28px 16px 8px}

/* Kalender */
.mhead{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px}
.mhead h1{margin:0;font-size:28px}
.arrows{display:flex;gap:4px}
.arrow{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--red);transition:background .1s}
.arrow:active{background:var(--s2)}
.arrow svg{width:22px;height:22px}
.wd,.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wd{font-size:12px;color:var(--tx2);font-weight:600;margin-bottom:6px}
.grid{row-gap:3px}
.day{position:relative;aspect-ratio:1.12;display:grid;place-items:center;font-size:17px;font-variant-numeric:tabular-nums}
.day .c{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;position:relative;transition:transform .1s ease-out}
.day:active .c{transform:scale(.9)}
.day.fut{color:var(--tx3)}
.day.sel .c{outline:2px solid var(--acc);outline-offset:2px}
#dayPrev{scroll-margin-bottom:104px}
.phd{display:flex;justify-content:space-between;align-items:center;margin:12px 16px 6px;gap:12px}
.ptog{display:flex;align-items:center;gap:8px;min-width:0;flex:1;padding:6px 0;text-align:left}
.ptog b{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptog svg{width:11px;height:11px;flex:none;color:var(--tx2);transition:transform .2s ease}
.ptog.open svg{transform:rotate(90deg)}
.phd .pedit{color:var(--acc);font-weight:600;padding:6px 0 6px 12px;flex:none}
.psum{margin:-2px 16px 8px 35px;font-size:14px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv{background:var(--s1);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.pv .pl{font-size:13px;color:var(--tx2);margin-bottom:6px}
.pv .chips{display:flex;flex-wrap:wrap;gap:6px}
.pv .cp{padding:5px 12px;border-radius:15px;font-size:15px;font-weight:500;background:var(--s2)}
.pv .cp.m{background:rgba(191,90,242,.2);color:#d58cff}
.pv .cp.p{background:rgba(255,214,10,.16);color:#ffd60a}
.pv .cp.b{background:rgba(10,132,255,.2);color:#6cb2ff}
.pv .cp.r{background:rgba(255,55,95,.18);color:#ff6b88}
.pv .cp.o{background:rgba(255,159,10,.18);color:#ffb340}
.pv .cp.c{background:rgba(100,210,255,.18);color:#64d2ff}
.pv .cp.s{background:rgba(208,138,92,.2);color:#e0a37a}
.pv .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pv .mt{display:flex;align-items:center;gap:10px}
.pv .meter{display:flex;gap:3px;flex:none}
.pv .meter i{width:16px;height:8px;border-radius:4px;background:var(--s3)}
.pv .mt b{font-size:15px;font-weight:600}
.pv .note{border-left:3px solid var(--acc);padding-left:12px;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.pv .empty{text-align:center;color:var(--tx2);font-size:15px;padding:4px 0}
.day .ap{position:absolute;top:3px;right:calc(50% - 22px);width:7px;height:7px;border-radius:2px;background:var(--blue)}
.day.today .c{box-shadow:inset 0 0 0 2px var(--tx)}
.day.f1 .c{background:rgba(255,55,95,.35)}
.day.f2 .c{background:rgba(255,55,95,.6)}
.day.f3 .c{background:rgba(255,55,95,.85)}
.day.f4 .c{background:var(--red);box-shadow:0 0 0 3px rgba(255,55,95,.35)}
.day.today.f4 .c{box-shadow:inset 0 0 0 2px var(--tx),0 0 0 3px rgba(255,55,95,.35)}
.day.sp .c::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px dashed var(--spot)}
.day .dots{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px;pointer-events:none}
.day .dots i{width:4px;height:4px;border-radius:50%}
.day.pp .c{background:rgba(255,55,95,.2)}
.day.pf .c{background:rgba(100,210,255,.15)}
.day.po .c{background:rgba(100,210,255,.32)}
.day.ps .c{background:rgba(255,159,10,.14)}
.day.fut.pp,.day.fut.pf,.day.fut.po,.day.fut.ps{color:var(--tx2)}
.legend{flex-wrap:wrap;row-gap:6px}

/* Zyklus */
.ring{position:relative;width:min(358px,92vw);margin:4px auto 20px;aspect-ratio:1}
.ring svg{width:100%;height:100%;overflow:visible}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 17%;pointer-events:none;text-align:center}
.ring .pemo{font-size:34px;line-height:1;margin-bottom:8px}
.ring .pdate{font-size:15px;line-height:1.2;color:var(--tx2);font-weight:500}
.ring .phead{font-size:30px;line-height:1.08;font-weight:700;letter-spacing:-.025em;text-wrap:balance;margin:8px 0 10px}
.ring .pfun{font-size:15px;line-height:1.35;color:var(--tx2);text-wrap:balance}
#vCyc{position:relative}
#ringSvg{touch-action:none;cursor:pointer}
.back{position:absolute;top:10px;right:0;padding:8px 16px;border-radius:18px;background:rgba(255,55,95,.16);background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);font-size:15px;font-weight:600;transition:transform .1s ease-out,background .1s}
.back:active{transform:scale(.96);background:rgba(255,55,95,.28);background:color-mix(in srgb,var(--acc) 28%,transparent)}
.feel{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:8px 16px 8px 10px;margin-bottom:12px;border-radius:30px;background:#3d2a1a;text-align:left;font-size:17px;font-weight:600;transition:transform .1s ease-out,background .1s}
.feel:active{transform:scale(.98);background:#4a3320}
.fr{display:flex;gap:10px;margin-bottom:12px}
.fr .feel{flex:1;width:auto;min-width:0;margin-bottom:0}
.shr{width:60px;height:60px;flex:none;border-radius:30px;background:rgba(255,55,95,.18);background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);display:grid;place-items:center;transition:transform .1s ease-out,background .1s}
.shr:active{transform:scale(.94);background:rgba(255,55,95,.3);background:color-mix(in srgb,var(--acc) 30%,transparent)}
.shr svg{width:24px;height:24px}
.feel .fi{width:40px;height:40px;border-radius:20px;background:var(--pms);display:grid;place-items:center;flex:none}
.feel .fi svg{width:22px;height:22px}
.feel span.t{flex:1}
.feel .ch{width:12px;height:20px;color:var(--pms);flex:none}
.info .row{min-height:60px;padding:10px 16px 10px 20px;gap:14px}
.info .row+.row::before{left:44px}
.info .ic{width:10px;height:10px;border-radius:50%;flex:none}
.info .ic.sq{border-radius:3px}
.info .lt{flex:1;min-width:0;display:flex;flex-direction:column}
.info .lt small,.info .rt small{white-space:nowrap;font-size:13px;line-height:1.3;color:var(--tx2)}
.info .rt{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.info .rt b{font-weight:600}
.info .rt .warn{color:var(--pms)}
.info .rt .late{color:var(--pms)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.card{background:var(--s1);border-radius:16px;padding:14px 16px}
.card .t{font-size:13px;color:var(--tx2);display:flex;align-items:center;gap:6px}
.card .t i{width:8px;height:8px;border-radius:50%}
.card .v{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:6px}
.card .d{font-size:15px;color:var(--tx2);margin-top:2px}
.card .v.late{color:#ff9f0a}
.seg.wide{margin:0 0 16px}
.chart{background:var(--s1);border-radius:16px;padding:14px 12px 10px;margin-top:12px}
.chart h3{margin:0 4px 10px;font-size:15px;font-weight:600}
.chart svg{width:100%;display:block}
.strip{display:flex;align-items:center;gap:8px;padding:3px 4px;font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums}
.strip .m{width:52px;flex:none}
.strip .sq{display:flex;gap:3px;flex:1}
.strip .sq i{width:14px;height:14px;border-radius:4px;background:var(--s2)}
.strip .n{width:28px;text-align:right}
.cmp{width:100%;border-collapse:collapse;font-size:15px}
.cmp td,.cmp th{padding:9px 6px;text-align:right;border-top:.5px solid var(--sep)}
.cmp th{font-weight:600;color:var(--tx2);font-size:13px;border-top:0}
.cmp td:first-child,.cmp th:first-child{text-align:left;color:var(--tx2)}
.legend{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--tx2);margin:16px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.todaybtn{display:block;width:100%;margin-top:24px;padding:14px;border-radius:14px;background:var(--s1);color:var(--acc);font-weight:600;transition:transform .1s ease-out,background .1s}
.todaybtn:active{transform:scale(.98);background:var(--s2)}

/* Listen / Einstellungen */
.group{background:var(--s1);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:12px 16px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
button.row{transition:background .1s}
button.row:active{background:var(--s2)}
.row.act{color:var(--blue)}
.row.danger{color:var(--red)}
.note{font-size:13px;color:var(--tx2);margin:8px 16px 0}
.note.warn{color:#ff9f0a}
.seg{display:flex;background:var(--s2);border-radius:9px;padding:2px}
.seg button{flex:1;padding:6px 14px;border-radius:7px;font-size:15px;font-weight:500;transition:background .2s}
.seg button.on{background:#636366}

/* Tab-Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:6px 0 calc(var(--sb) + 4px);
  background:rgba(22,22,24,.72);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-top:.5px solid rgba(255,255,255,.12);z-index:10}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:#8e8e93;min-width:64px;padding:2px 0}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--acc)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--s1);border-radius:14px 14px 0 0;
  padding:8px 16px calc(var(--sb) + 20px);transform:translateY(105%);transition:transform .45s cubic-bezier(.32,.72,0,1);z-index:30;overscroll-behavior:contain}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{padding:4px 0 8px;touch-action:none}
.grab::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto 12px}
.shead{display:flex;align-items:center;justify-content:space-between}
.shead h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.done{color:var(--red);font-weight:600;padding:8px 0 8px 16px}
.lbl{font-size:13px;color:var(--tx2);text-transform:uppercase;letter-spacing:.02em;margin:22px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:20px;background:var(--s2);font-size:15px;transition:transform .1s ease-out,background .15s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--red);color:#fff}
.chip.mood.on{background:var(--mood)}
.chip.alt.on{background:#fff;color:#000}
.field{width:100%;background:var(--s2);color:var(--tx);border:0;border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;outline:none}
textarea.field{min-height:84px;resize:vertical}
.field::placeholder{color:var(--tx3)}
.row input[type=date],.row select{background:var(--s2);color:var(--tx);border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:16px}
.info{margin-top:12px}
.switchrow{display:flex;align-items:center;justify-content:space-between;background:var(--s2);border-radius:12px;padding:10px 14px}
.sw{width:51px;height:31px;border-radius:16px;background:#39393d;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .25s cubic-bezier(.32,.72,0,1)}
.sw.on{background:var(--spot)}
.sw.on::after{transform:translateX(20px)}

/* Dialog + Toast */
.dlg{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.dlg.on{opacity:1;pointer-events:auto}
.box{width:min(300px,84vw);background:rgba(44,44,46,.92);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;text-align:center;overflow:hidden;transform:scale(1.1);transition:transform .2s}
.dlg.on .box{transform:scale(1)}
.box p{margin:0;padding:20px 16px;font-size:15px;line-height:1.35}
.btns{display:flex;border-top:.5px solid var(--sep)}
.btns button{flex:1;padding:12px;color:var(--blue);font-size:17px}
.btns button+button{border-left:.5px solid var(--sep);font-weight:600}
.btns button.danger{color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 90px);transform:translate(-50%,20px);background:rgba(58,58,60,.95);padding:10px 18px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .25s,transform .25s;z-index:60;max-width:90vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.upd{position:fixed;left:50%;bottom:calc(var(--sb) + 78px);transform:translateX(-50%);z-index:70;padding:11px 20px;border-radius:22px;background:var(--acc);color:#000;font-size:15px;font-weight:600;white-space:nowrap;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.upd[hidden]{display:none}

@media (prefers-reduced-motion:reduce){
  .sheet,.scrim,.dlg,.box,.toast,.sw::after{transition:opacity .2s!important}
  .sheet{transform:none;opacity:0;pointer-events:none}.sheet.on{opacity:1;pointer-events:auto}
}
@media (prefers-reduced-transparency:reduce){.tabs,.box{background:#1c1c1e;backdrop-filter:none;-webkit-backdrop-filter:none}}
</style>
</head>
<body>

<section class="view on" id="vCyc">
  <h1 data-t="cycle"></h1>
  <div id="cyc"></div>
</section>

<section class="view" id="vCal">
  <div class="mhead">
    <h1 id="mTitle"></h1>
    <div class="arrows">
      <button class="arrow" id="prev" aria-label="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="arrow" id="next" aria-label="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>
  <div class="wd" id="wd"></div>
  <div class="grid" id="grid"></div>
  <div id="dayPrev"></div>
  <div class="legend" id="legend"></div>
  <button class="todaybtn" id="todayBtn"></button>
</section>

<section class="view" id="vAna">
  <h1 data-t="analysis"></h1>
  <div class="seg wide" id="rangeSeg"><button data-r="12"></button><button data-r="0"></button></div>
  <div id="ana"></div>
</section>

<section class="view" id="vSet">
  <h1 data-t="settings"></h1>
  <h2 data-t="language"></h2>
  <div class="group"><div class="row"><span data-t="language"></span>
    <div class="seg" id="langSeg"><button data-l="de">DE</button><button data-l="ru">RU</button></div></div></div>

  <h2 data-t="backup"></h2>
  <div class="group">
    <button class="row act" id="exportBtn" data-t="export"></button>
    <button class="row act" id="copyBtn" data-t="copy"></button>
    <button class="row act" id="importBtn" data-t="import"></button>
  </div>
  <p class="note" id="stats"></p>
  <p class="note" id="lastBk"></p>
  <p class="note" data-t="importHint"></p>
  <p class="note warn" id="sbNote" hidden data-t="sandboxNote"></p>
  <p class="note warn" id="memNote" hidden data-t="storageWarn"></p>

  <h2 data-t="contraception"></h2>
  <div class="group">
    <div class="row"><span data-t="iudSince"></span><input type="date" id="iudDate"></div>
    <div class="row"><span data-t="iudYears"></span><select id="iudYears"><option value="3">3</option><option value="5">5</option><option value="10">10</option></select></div>
  </div>
  <p class="note" data-t="iudHint"></p>

  <h2>&nbsp;</h2>
  <div class="group"><button class="row danger" id="wipeBtn" data-t="deleteAll"></button></div>
  <p class="note" id="verNote" style="text-align:center;margin-top:20px"></p>
  <input type="file" id="file" accept=".json,application/json" hidden>
</section>

<nav class="tabs">
  <button class="tab on" data-v="vCyc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a9 9 0 1 1-8.5 6"/><circle cx="12" cy="3.5" r="1.6" fill="currentColor"/></svg><span data-t="cycle"></span></button>
  <button class="tab" data-v="vCal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-t="calendar"></span></button>
  <button class="tab" data-v="vAna"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-t="analysis"></span></button>
  <button class="tab" data-v="vSet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span data-t="settings"></span></button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog">
  <div class="grab" id="grab"><div class="shead"><h3 id="sTitle"></h3><button class="done" id="doneBtn" data-t="done"></button></div></div>
  <div id="pastSec">
  <div class="lbl" data-t="bleeding"></div>
  <div class="chips" id="flowChips"></div>
  <div class="lbl">&nbsp;</div>
  <button class="switchrow" id="spotRow" style="width:100%"><span data-t="spotting"></span><span class="sw" id="spotSw"></span></button>
  <div class="lbl" data-t="pain"></div>

/* ---------- Speicher (IndexedDB) ---------- */
let db=null;const mem=new Map();
let meta={};
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('zyklus',2);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('days'))d.createObjectStore('days',{keyPath:'date'});
    if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null);}catch(e){res(null)}})}
function tx(fn){return new Promise((res,rej)=>{if(!db)return res();try{const x=db.transaction('days','readwrite');fn(x.objectStore('days'));
  x.oncomplete=()=>res();x.onerror=()=>rej(x.error);x.onabort=()=>rej(x.error)}catch(e){rej(e)}})}
function loadAll(){return new Promise(res=>{if(!db)return res();try{const r=db.transaction('days').objectStore('days').getAll();
  r.onsuccess=()=>{r.result.forEach(d=>mem.set(d.date,d));res()};r.onerror=()=>res()}catch(e){res()}})}
function loadMeta(){return new Promise(res=>{if(!db)return res();try{const r=db.transaction('meta').objectStore('meta').getAll();
  r.onsuccess=()=>{r.result.forEach(m=>meta[m.key]=m);res()};r.onerror=()=>res()}catch(e){res()}})}
function saveMeta(key,val){if(val)meta[key]={key,...val};else delete meta[key];
  return new Promise(res=>{if(!db)return res();try{const x=db.transaction('meta','readwrite'),st=x.objectStore('meta');
    val?st.put(meta[key]):st.delete(key);x.oncomplete=res;x.onerror=res}catch(e){res()}})}
const storeFail=()=>{db=null;$('memNote').hidden=false;toast(t('storageWarn'))};
const isEmpty=d=>!d.flow&&!d.spotting&&!(d.moods&&d.moods.length)&&!(d.pain&&d.pain.length)&&!d.energy&&!d.libido&&!d.sex&&!d.appt&&!d.note;

  if(isEmpty(d)){mem.delete(d.date);await tx(s=>s.delete(d.date)).catch(storeFail)}
  else{mem.set(d.date,d);await tx(s=>s.put(d)).catch(storeFail)}
}
async function saveMany(list,replace){
  if(replace)mem.clear();list.forEach(d=>mem.set(d.date,d));

}

/* ---------- Zyklus-Berechnung ---------- */
const DAY=864e5;
const diff=(a,b)=>Math.round((fromIso(b)-fromIso(a))/DAY);
const addDays=(s,n)=>{const d=fromIso(s);d.setDate(d.getDate()+n);return iso(d)};
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
function periods(){ // zusammenhängende Periodentage; Lücke ≤ 9 Tage = gleiche Periode
  const pd=[...mem.values()].filter(d=>d.flow).map(d=>d.date).sort(),runs=[];
  for(const s of pd){const l=runs[runs.length-1];if(l&&diff(l.end,s)<=9)l.end=s;else runs.push({start:s,end:s})}
  return runs;
}
function forecast(){
  const runs=periods();if(runs.length<2)return null;
  const lens=[];for(let i=1;i<runs.length;i++)lens.push(diff(runs[i-1].start,runs[i].start));
  const last=lens.slice(-6),avg=Math.round(mean(last));
  const durs=runs.map(r=>diff(r.start,r.end)+1).filter(n=>n>2).slice(-6);
  const avgDur=durs.length?Math.round(mean(durs)):5;
  const today=iso(new Date()),lastStart=runs[runs.length-1].start,next=addDays(lastStart,avg);
  return{avg,avgDur,k:last.length,lastStart,next,ov:addDays(next,-14),cycleDay:diff(lastStart,today)+1,today};
}
let fc=null;
function rel(n){return n===0?t('todayW'):n===1?t('tomorrow'):t('inDays',{n})}

function phaseOf(d){const f=fc;if(!f)return null;
  if(d<=f.perEnd)return'period';
  if(d>f.avg+1)return'late';
  if(d===f.ovDay)return'ov';
  if(d>=f.f1&&d<=f.f2)return'fertile';
  if(d>f.avg-7)return d<=f.avg-5?'pmsSoft':'pms';
  if(d<f.f1)return'rise';
  return'luteal';
}

function shareStatus(){

const FW={light:1,medium:2,heavy:3,very_heavy:4};
function cycleData(){
  const runs=periods().map(r=>{const days=[];for(let i=0;i<=diff(r.start,r.end);i++){const d=mem.get(addDays(r.start,i));days.push(d&&d.flow?d.flow:null)}
    const fl=days.filter(Boolean);return{...r,days,dur:days.length,intensity:fl.length?mean(fl.map(f=>FW[f])):0,heavy:fl.length?fl.filter(f=>FW[f]>=3).length/fl.length:0}});
  runs.forEach((r,i)=>{r.len=i<runs.length-1?diff(r.start,runs[i+1].start):null});
  return runs;
}
function stats(runs){
  const lens=runs.map(r=>r.len).filter(x=>x!=null),durs=runs.map(r=>r.dur).filter(n=>n>2);
  if(!lens.length)return null;const m=mean(lens);
  return{avg:m,sd:Math.sqrt(mean(lens.map(x=>(x-m)**2))),min:Math.min(...lens),max:Math.max(...lens),
    dur:durs.length?mean(durs):null,int:mean(runs.map(r=>r.intensity).filter(Boolean)),heavy:mean(runs.map(r=>r.heavy)),n:lens.length,runs:runs.length};
}

  if(r.pain.length){vals.push(r.pain.map(label).join(', '));blocks.push('<div><div class="pl">'+t('pain')+'</div><div class="chips">'+r.pain.map(k=>chip('p',label(k))).join('')+'</div></div>')}
  const lv=[];
  if(r.energy){vals.push(t('energy')+' '+t(r.energy).toLowerCase());lv.push('<div><div class="pl">'+t('energy')+'</div><div class="mt">'+meter(lvl(r.energy),3,'#30d158')+'<b>'+t(r.energy)+'</b></div></div>')}
  if(r.libido){vals.push(t('libido')+' '+t(r.libido).toLowerCase());lv.push('<div><div class="pl">'+t('libido')+'</div><div class="mt">'+meter(lvl(r.libido),3,'#ff6b88')+'<b>'+t(r.libido)+'</b></div></div>')}
  if(lv.length)blocks.push('<div class="two">'+lv.join('')+'</div>');
  if(tags.length)blocks.push('<div class="chips">'+tags.join('')+'</div>');
  if(r.note){vals.push(t('note'));blocks.push('<div class="note">'+esc(r.note)+'</div>')}
  const dt=fmt(calSel,{weekday:'long',day:'numeric',month:'short'});
  const sum=vals.length?vals.slice(0,3).join(' · ')+(vals.length>3?' · +'+(vals.length-3):''):t('prevEmpty');
  el.innerHTML='<div class="phd"><button class="ptog'+(prevOpen?' open':'')+'" id="prevTog" aria-expanded="'+prevOpen+'"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l8 8-8 8"/></svg><b>'+dt.charAt(0).toUpperCase()+dt.slice(1)+'</b></button><button class="pedit" id="prevEdit">'+t('prevEdit')+'</button></div>'+
    (prevOpen?'<div class="pv">'+(blocks.length?blocks.join(''):'<div class="empty">'+t('prevEmpty')+'</div>')+'</div>':'<div class="psum">'+sum+'</div>');
  $('prevTog').onclick=()=>{prevOpen=!prevOpen;store.set('prevOpen',prevOpen?'1':'0');renderPrev()};
  $('prevEdit').onclick=()=>openSheet(calSel);
}

$('next').onclick=()=>{view.setMonth(view.getMonth()+1);renderCal()};

let sx=null;$('grid').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
$('grid').addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;

/* ---------- Tages-Sheet ---------- */
let cur=null;
function renderSheet(){
  const r=getDay(cur);
  const s=fmt(cur,{weekday:'long',day:'numeric',month:'long'});
  $('sTitle').textContent=s.charAt(0).toUpperCase()+s.slice(1);
  $('flowChips').innerHTML=[null,...FLOWS].map(f=>'<button class="chip'+(r.flow===f?' on':'')+'" data-f="'+(f||'')+'">'+t(f||'none')+'</button>').join('');
  $('spotSw').classList.toggle('on',!!r.spotting);
  const ms=[...MOODS,...(r.moods||[]).filter(x=>!MOODS.includes(x))];
  $('moodChips').innerHTML=ms.map(k=>'<button class="chip mood'+((r.moods||[]).includes(k)?' on':'')+'" data-m="'+k+'">'+label(k)+'</button>').join('');
  const ps=[...PAINS,...(r.pain||[]).filter(x=>!PAINS.includes(x))];
  $('painChips').innerHTML=ps.map(k=>'<button class="chip alt'+((r.pain||[]).includes(k)?' on':'')+'" data-m="'+k+'">'+label(k)+'</button>').join('');
  const one=(id,field,opts,lbl)=>$(id).innerHTML=opts.map(o=>'<button class="chip alt'+(r[field]===o?' on':'')+'" data-v="'+o+'">'+t(lbl?lbl(o):o)+'</button>').join('');
  one('energyChips','energy',LEVELS);one('libidoChips','libido',LEVELS);one('sexChips','sex',SEXES,o=>o==='none'?'sexNone':o);
  const fut=cur>iso(new Date());$('pastSec').hidden=fut;$('noteSec').hidden=fut;
  if(document.activeElement!==$('apptIn'))$('apptIn').value=r.appt||'';
  if(document.activeElement!==$('noteIn'))$('noteIn').value=r.note||'';
  $('apptIn').placeholder=t('apptPh');$('noteIn').placeholder=t('notePh');
}
const PAINS=['cramps','headache','breasts','back'],LEVELS=['low','ok','high'],SEXES=['none','protected','unprotected'];
async function update(fn,keep){const r=getDay(cur);const c={...r,moods:[...r.moods],pain:[...r.pain]};fn(c);
  for(const k of['energy','libido','sex'])if(!c[k])delete c[k];for(const k of['appt','note'])if(!c[k])delete c[k];if(!c.pain.length)delete c.pain;
  await saveDay(c);if(!keep)renderSheet();refresh()}
$('painChips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const k=b.dataset.m;
  update(r=>{r.pain=r.pain.includes(k)?r.pain.filter(x=>x!==k):[...r.pain,k]})});
[['energyChips','energy'],['libidoChips','libido'],['sexChips','sex']].forEach(([id,f])=>$(id).addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(b)update(r=>{r[f]=r[f]===b.dataset.v?null:b.dataset.v})}));
let txT;[['apptIn','appt'],['noteIn','note']].forEach(([id,f])=>$(id).addEventListener('input',e=>{
  clearTimeout(txT);const v=e.target.value,d=cur;txT=setTimeout(()=>{if(d===cur)update(r=>{r[f]=v.trim()},true)},400)}));
$('flowChips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)update(r=>{r.flow=b.dataset.f||null})});
$('spotRow').onclick=()=>update(r=>{r.spotting=!r.spotting});
$('moodChips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const k=b.dataset.m;
  update(r=>{r.moods=r.moods.includes(k)?r.moods.filter(x=>x!==k):[...r.moods,k]})});
function openSheet(d){cur=d;renderSheet();$('sheet').scrollTop=0;$('sheet').classList.add('on');$('scrim').classList.add('on')}
function closeSheet(){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();const sh=$('sheet');sh.style.transform='';sh.classList.remove('on','drag');$('scrim').classList.remove('on');$('scrim').style.opacity=''}
$('doneBtn').onclick=()=>{closeSheet();revealPrev()};$('scrim').onclick=()=>{closeSheet();revealPrev()};
/* Sheet nach unten ziehen: 1:1, Geschwindigkeit entscheidet */
(()=>{const sh=$('sheet'),g=$('grab');let y0=null,hist=[];
  g.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;y0=e.clientY;hist=[[e.clientY,e.timeStamp]];g.setPointerCapture(e.pointerId);sh.classList.add('drag')});
  g.addEventListener('pointermove',e=>{if(y0==null)return;let dy=e.clientY-y0;if(dy<0)dy=-Math.sqrt(-dy)*2;
    sh.style.transform='translateY('+dy+'px)';$('scrim').style.opacity=String(Math.max(0,1-dy/400));
    hist.push([e.clientY,e.timeStamp]);if(hist.length>5)hist.shift()});
  const end=e=>{if(y0==null)return;const dy=e.clientY-y0;const a=hist[0],b=hist[hist.length-1];const v=b[1]>a[1]?(b[0]-a[0])/(b[1]-a[1])*1000:0;
    y0=null;sh.classList.remove('drag');
    if(dy+v*0.2>140||v>800)closeSheet();else{sh.style.transform='';$('scrim').style.opacity=''}};
  g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
})();

/* ---------- Tabs ---------- */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{

/* ---------- Sprache ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));

  $('legend').innerHTML='<span><i style="background:var(--red)"></i>'+t('legP')+'</span><span><i style="border:2px dashed var(--spot);width:8px;height:8px"></i>'+t('legS')+'</span><span><i style="background:var(--mood);width:6px;height:6px"></i>'+t('legM')+'</span><span><i style="background:#ffd60a;width:6px;height:6px"></i>'+t('pain')+'</span><span><i style="background:#30d158;width:6px;height:6px"></i>'+t('energy')+'</span><span><i style="background:#fff;width:6px;height:6px"></i>'+t('note')+'</span><span><i style="background:rgba(255,55,95,.4)"></i>'+t('legF')+'</span><span><i style="background:rgba(100,210,255,.4)"></i>'+t('legFert')+'</span><span><i style="background:rgba(255,159,10,.4)"></i>PMS</span><span><i style="background:var(--blue);border-radius:2px;width:8px;height:8px"></i>'+t('appt')+'</span>';
  refresh();if(cur)renderSheet();
}
$('langSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;store.set('lang',lang);applyLang()});

/* ---------- Dialog / Toast ---------- */
function ask(msg,yes,danger){return new Promise(res=>{$('dlgMsg').textContent=msg;$('dlgNo').textContent=t('cancel');
  const y=$('dlgYes');y.textContent=yes;y.className=danger?'danger':'';$('dlg').classList.add('on');
  const done=v=>{$('dlg').classList.remove('on');res(v)};$('dlgNo').onclick=()=>done(false);y.onclick=()=>done(true)})}
let tt;function toast(m){const el=$('toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2600)}

/* ---------- Statistik-Zeilen ---------- */
function renderStats(){
  const ks=[...mem.keys()].sort();
  $('stats').textContent=ks.length?t('stats',{n:ks.length,d:fmt(ks[0],{day:'numeric',month:'short',year:'numeric'})}):t('noData');
  const lb=store.get('lastBackup');
  $('lastBk').textContent=lb?t('lastBk',{d:fmt(lb,{day:'numeric',month:'short',year:'numeric'})}):t('noBk');

/* ---------- Export ---------- */
function backupJSON(){return JSON.stringify({app:'zyklus',version:2,exportedAt:new Date().toISOString(),
  meta:Object.fromEntries(Object.entries(meta).map(([k,v])=>[k,(({key,...r})=>r)(v)])),days:[...mem.values()].sort((a,b)=>a.date<b.date?-1:1)},null,1)}
const markBackup=()=>{store.set('lastBackup',iso(new Date()));renderStats()};
$('exportBtn').onclick=async()=>{
  const name='zyklus-backup-'+iso(new Date())+'.json',txt=backupJSON();
  try{const f=new File([txt],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});markBackup();toast(t('exported'));return}}
  catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);markBackup();toast(t('exported'));
};
$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(backupJSON());markBackup();toast(t('copied'))}catch(e){toast(t('copyFail'))}};

/* ---------- Import (eigenes Backup oder Clue) ---------- */
function parseClue(arr){
  const out=new Map(),c={p:0,s:0,m:0,o:0};
  const get=d=>{if(!out.has(d))out.set(d,{date:d,flow:null,spotting:false,moods:[]});return out.get(d)};
  const map={light:'light',medium:'medium',heavy:'heavy',super_heavy:'very_heavy',very_heavy:'very_heavy'};
  for(const it of arr){
    if(!it||typeof it.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(it.date))continue;
    const v=it.value,opts=Array.isArray(v)?v.map(x=>x&&x.option).filter(Boolean):(v&&v.option?[v.option]:[]);
    if(it.type==='period'){const f=map[opts[0]];if(f){get(it.date).flow=f;c.p++}}
    else if(it.type==='spotting'){get(it.date).spotting=true;c.s++}
    else if(it.type==='feelings'&&opts.length){const r=get(it.date);opts.forEach(o=>{if(!r.moods.includes(o))r.moods.push(o)});c.m++}
    else if(it.type==='pain'&&opts.length){const r=get(it.date);r.pain=r.pain||[];
      opts.map(o=>({period_cramps:'cramps',cramps:'cramps',headache:'headache',breast_tenderness:'breasts',tender_breasts:'breasts',lower_back:'back',backache:'back',back_pain:'back'}[o]||o))
        .forEach(o=>{if(!r.pain.includes(o))r.pain.push(o)});c.o++}
    else if(it.type==='energy'&&opts.length){const e={exhausted:'low',tired:'low',low_energy:'low',ok:'ok',fine:'ok',energized:'high',high_energy:'high'}[opts[0]];if(e){get(it.date).energy=e;c.o++}}
    else if(it.type==='sex_life'&&opts.length){const r=get(it.date);
      for(const o of opts){if(o==='protected')r.sex='protected';else if(o==='unprotected'||o==='withdrawal')r.sex='unprotected';
        else if(o==='no_sex_today'&&!r.sex)r.sex='none';else if(o==='high_sex_drive')r.libido='high';else if(o==='low_sex_drive')r.libido='low'}c.o++}
  }
  return{days:[...out.values()].filter(d=>!isEmpty(d)),c};
}
function cleanDay(d){if(!d||typeof d.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(d.date))return null;
  const arr=a=>Array.isArray(a)?a.filter(x=>typeof x==='string'):[],str=v=>typeof v==='string'&&v?v.slice(0,2000):undefined;
  const o={date:d.date,flow:FLOWS.includes(d.flow)?d.flow:null,spotting:!!d.spotting,moods:arr(d.moods)};
  if(arr(d.pain).length)o.pain=arr(d.pain);
  if(LEVELS.includes(d.energy))o.energy=d.energy;if(LEVELS.includes(d.libido))o.libido=d.libido;if(SEXES.includes(d.sex))o.sex=d.sex;
  if(str(d.appt))o.appt=str(d.appt);if(str(d.note))o.note=str(d.note);return o}
$('importBtn').onclick=()=>{$('file').value='';$('file').click()};
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;let data;
  try{data=JSON.parse(await f.text())}catch(err){toast(t('badFile'));return}
  if(Array.isArray(data)&&data.some(x=>x&&x.type&&x.date)){
    const{days,c}=parseClue(data);if(!days.length){toast(t('badFile'));return}
    if(!await ask(t('clueFound',c)+(c.o?t('clueMore',c):''),t('add')))return;
    const merged=days.map(d=>{const e=mem.get(d.date);if(!e)return d;
      const m={...e,...Object.fromEntries(Object.entries(d).filter(([k,v])=>v))};
      m.spotting=!!(d.spotting||e.spotting);m.moods=[...new Set([...(e.moods||[]),...d.moods])];
      if(e.pain||d.pain)m.pain=[...new Set([...(e.pain||[]),...(d.pain||[])])];return m});
    await saveMany(merged,false);toast(t('imported',{n:days.length}));
  }else if(data&&data.app==='zyklus'&&Array.isArray(data.days)){
    const days=data.days.map(cleanDay).filter(d=>d&&!isEmpty(d));
    const d=data.exportedAt?fmt(data.exportedAt.slice(0,10),{day:'numeric',month:'short',year:'numeric'}):'?';
    if(!await ask(t('backupFound',{d,n:days.length}),t('replace'),true))return;
    await saveMany(days,true);
    for(const k of Object.keys(meta))await saveMeta(k,null);
    if(data.meta&&typeof data.meta==='object')for(const[k,v]of Object.entries(data.meta))if(v&&typeof v==='object')await saveMeta(k,v);
    renderIud();toast(t('imported',{n:days.length}));
  }else{toast(t('badFile'));return}
  refresh();
};
$('wipeBtn').onclick=async()=>{if(!await ask(t('deleteConfirm'),t('del'),true))return;await saveMany([],true);refresh();toast(t('wiped'))};

let updTo=null;
async function checkUpdate(){
  if(!navigator.onLine||location.protocol==='file:')return;
  try{
    const r=await fetch(location.pathname,{cache:'reload'});
    if(!r.ok)return;
    const m=(await r.text()).match(/const BUILD='([^']+)'/);
    if(m&&m[1]!==BUILD){updTo=m[1];const u=$('upd');u.textContent=t('updAvail');u.hidden=false}
  }catch(e){}
}
$('upd').onclick=()=>{location.href=location.pathname+'?v='+encodeURIComponent(updTo||Date.now())};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});

/* ---------- Start ---------- */
(async()=>{
  $('sbNote').hidden=(window.self===window.top);
  db=await openDB();if(!db)$('memNote').hidden=false;else{await loadAll();await loadMeta()}renderIud();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  calSel=iso(new Date());
  applyLang();
  $('verNote').textContent='Version '+BUILD;
  setTimeout(checkUpdate,1500);
})();
